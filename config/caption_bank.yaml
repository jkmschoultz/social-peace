overlay_text:
- Let this be enough for now.
- Put the day down for a minute.
- Breathe like you have nowhere to be.
- Your only job right now is to rest.
- Let the next breath be slower.
- Nothing here needs fixing.
- Rest your eyes on something green.
- You can stop holding it all.
- Let your hands go loose.
- This moment asks nothing of you.
- Slow down to the speed of your breath.
- Unhurry yourself.
- You don't have to earn this pause.
- Let the water do the moving.
- Set it all down for sixty seconds.
- Loosen your grip on the day.
- Let your breath reach your belly.
- There is nowhere you need to be.
- Let the quiet in.
- Rest is not falling behind.
- Let your face relax completely.
- One long breath. Then another.
- Let the tension leave your neck.
- Slow all the way down.
- Watch the light move. That's all.
- Let your jaw hang loose.
- Give yourself this one still minute.
- Nothing to catch up on here.
- Let your breathing get boring.
- Sink back into your chair.
- The world keeps without you for a minute.
- Let your shoulders melt down your back.
- You can rest before you finish everything.
- Let this breath be for nothing.
- Stay until the next breath feels easy.
- Let the day blur for a moment.
- You don't have to be anywhere right now.
- Let your eyes go soft and unfocused.
- Breathe out longer than you breathe in.
- Let the ground hold you up.
- No one needs an answer right now.
- Let your thoughts drift past like water.
- Rest here. The list can wait.
- Let your breath find its own slow pace.
- You are allowed to take up this minute.
- Let the stillness be the point.
- Feel your feet. Feel your breath.
- Nothing to prove in the next sixty seconds.
- Let your body get heavy and warm.
- Come back to your breath. Stay a while.
