# Global configuration for social-peace.
# Paths are resolved relative to the repo root.

project:
  # Platforms the review UI's Publish button, `run`, and `publish-approved` target.
  # youtube: live.  instagram: live via an ephemeral cloudflared tunnel (or
  # INSTAGRAM_PUBLIC_BASE_URL).  tiktok: live after `social-peace tiktok-login`;
  # posts are SELF_ONLY until the app passes TikTok's audit (metadata.tiktok.privacy).
  target_platforms: [youtube, instagram, tiktok]
  timezone: "Europe/Berlin"        # CET/CEST — schedule.slots are wall-clock times here

# Posting schedule. Approved renders form a queue (reorder it in the review UI);
# at each slot the head of the queue goes out to target_platforms. A timer runs
# `social-peace publish-due` every few minutes to fire the slots — see
# scripts/systemd/. `social-peace schedule` shows what's queued for when.
schedule:
  enabled: true
  slots: ["08:00", "12:30", "19:00"]
  per_slot: 1              # renders posted per slot
  grace_minutes: 90        # a slot noticed later than this (machine asleep) is skipped, not posted late
  max_attempts: 3          # per platform; after that a failing render drops out of the queue
  low_queue_days: 1.0      # review UI warns when the approved queue covers less than this

# `social-peace pipeline`: scrape -> auto-promote -> render a batch for review.
pipeline:
  fetch_sources: [pexels, pixabay]   # stock video sources to rotate through
  fetch_audio: true                  # also pull CC0 beds from Freesound (needs FREESOUND_API_KEY)
  # Before each render batch (nightly run + the UI's Generate button), fetch only
  # when the library is short of clips / beds no pending, approved or published
  # render uses: enough for the batch (~2.5 clips, ~1.5 beds per render), and at
  # least min_unused_*. Search terms rotate through `queries` below, round-robin
  # across runs; results the library already has (or had) are skipped.
  min_unused_clips: 8
  min_unused_audio: 4
  fetch_per_run: 6                   # minimum items to request per source when fetching
  max_fetch_per_source: 15           # cap per source per run
  auto_promote: true                 # move _incoming/ up into the render pool automatically
  batch_size: 4                      # videos per manual "Generate" / fixed-size run
  # Scheduled runs size the batch to keep the posting queue stocked:
  # render enough that, at your recent approval rate, approved + pending covers
  # target_queue_days of slots. `--batch N` overrides.
  adaptive_batch: true
  target_queue_days: 3
  max_batch: 12                      # cap per run (render time adds up)
  queries:
    video:
      - "slow ocean waves"
      - "forest light morning"
      - "still mountain lake"
      - "drifting clouds timelapse"
      - "rain on green leaves"
      - "calm river current"
    audio:
      - "ambient drone calm"
      - "gentle rain loop"
      - "forest birds ambience"
      - "soft piano ambient"
      - "ocean waves loop"

render:
  resolution: [1080, 1920]        # 9:16
  fps: 30
  duration_seconds: [35, 55]      # a random length in this range is chosen per video
  audio_fade_in: 2.0
  audio_fade_out: 3.0
  loudness_lufs: -14.0            # integrated loudness target (typical for social)
  # Video encoder: auto = use the GPU's hardware encoder (NVIDIA NVENC) when a
  # test encode succeeds, else libx264 on the CPU. Or pin libx264 / h264_nvenc.
  # Only the final encode moves to the GPU; the filters (scale, crossfade,
  # zoom, overlay) always run on the CPU.
  encoder: auto
  crf: 19                         # libx264 quality (lower = better/bigger)
  preset: medium                  # libx264 speed/size trade-off
  # nvenc_cq: 21                  # NVENC quality (lower = better); defaults to crf + 2
  # Don't overload the PC: renders (Generate, Fill queue, re-rolls, the nightly
  # run) go one at a time machine-wide, each waiting until CPU use and free
  # memory are back within these limits, and run at lower priority (nice).
  nice: 10                        # 0 = normal priority, 19 = lowest
  throttle:
    max_cpu_percent: 85           # wait while the whole machine is busier than this
    min_free_memory_gb: 4         # ...or has less memory free than this
    check_seconds: 10
    max_wait_minutes: 0           # 0 = wait as long as it takes
  keep_overlay_png: false         # keep the generated text PNG next to the mp4 for debugging

paths:
  video_assets: assets/video
  audio_assets: assets/audio
  fonts: assets/fonts
  output: output
  logs: logs

# Optional. If assets/manifest.yaml exists it is used for tag-based selection and
# license tracking. Files not listed there are still usable (matched by filename).
assets_manifest: assets/manifest.yaml

# Overlay copy. One line is chosen at random per video (seeded, so reproducible).
overlay_text:
  - "Take 60 seconds. Breathe."
  - "Unclench your jaw. Drop your shoulders."
  - "Look away from the screen for a moment."
  - "Inhale for 4. Hold for 4. Exhale for 6."
  - "Nothing to scroll here. Just rest."
  - "You are allowed to do nothing right now."
  - "Let your shoulders fall."
  - "This is your minute. Nothing else."
  - "Soften your eyes. Slow your breath."
  - "The scroll can wait."
  - "Just watch. Just breathe."
  - "No task here. Only rest."

# Optional small second line (handle / watermark). Set to "" to disable.
overlay_footer: ""

# Platform captions (YouTube title/description, TikTok/Instagram caption) are
# written fresh per video by Claude, in the style of the example lists under
# `metadata:` below, instead of picking one of those lines verbatim. Needs
# ANTHROPIC_API_KEY in .env; with it unset, disabled, or on any API error, the
# old rng.choice-from-the-list behaviour is the fallback — nothing hard-fails.
captions:
  enabled: true
  model: claude-opus-5
  effort: low              # low | medium | high | xhigh | max
  max_output_tokens: 700

retention:
  rejected_days: 30        # `prune` and the review server on startup delete
                           # rejected renders older than this (frees output/ space)

metadata:
  youtube:
    title_templates:
      - "{hook} 🌿 #shorts"
      - "{hook} #shorts #calm"
      - "{hook} — a 60-second reset 🌊 #shorts"
      - "{hook} #shorts #calm #relax"
      - "{hook} 🤍 #shorts #mindfulness"
      - "{hook} 🌙 #shorts"
      - "{hook} — press pause 🍃 #shorts"
      - "{hook} #shorts #relax #nature"
    description: |
      A short calming break — original ambient nature footage and sound.
      No doom-scrolling here. Follow for a daily reset.
    tags: [calm, relax, nature, ambient, mindfulness, breathe, shorts, lofi]
    category_id: "22"          # People & Blogs
    privacy: public            # NOTE: YouTube forces uploads to private + locks them
                               # while the OAuth consent screen is in "Testing" mode.
                               # Move it to "In production" for this to take effect.
    made_for_kids: false
  hashtags:
    - "#calm"
    - "#relax"
    - "#nature"
    - "#breathe"
    - "#mindfulness"
    - "#shorts"
  # Per-platform captions. One template is chosen per video (seeded, reproducible);
  # {hook} is the overlay line with trailing punctuation stripped. Editable in the
  # review interface before approval.
  tiktok:
    caption_templates:
      - "{hook} 🌿"
      - "{hook} — breathe with me"
      - "{hook} — stay a minute"
      - "{hook} 🌙"
      - "{hook}\n\nlet this be your pause"
      - "{hook} 🌊 close your eyes after this one"
      - "{hook} 🍃 a small rest, right now"
      - "{hook} — one slow minute"
    hashtags: ["#calm", "#relax", "#nature", "#breathe", "#fyp"]
    privacy: "SELF_ONLY"        # TikTok API value; start private, flip after review of the flow
  instagram:
    caption_templates:
      - "{hook}\n\nfollow for a daily reset 🌿"
      - "{hook}"
      - "{hook}\n\nsave this for a hard day 🍃"
      - "{hook}\n\none minute. that's all this asks."
      - "{hook}\n\na pause, in case no one told you to take one 🌿"
      - "{hook}\n\nbreathe with it 🌊"
      - "{hook}\n\ncome back to this when the day gets loud 🌙"
      - "{hook}\n\nlet your shoulders drop 🤍"

fetch:
  pixabay:
    # API key via PIXABAY_API_KEY in .env
    default_query: "nature calm slow"
    per_page: 20
    min_width: 1080
    video_type: film
  pexels:
    # API key via PEXELS_API_KEY in .env
    default_query: "calm nature vertical"
    orientation: portrait
    size: medium            # minimum upload size: large = 4K only, medium = Full HD+. The
                            # fetcher then downloads the smallest rendition covering render.resolution
    per_page: 15
  freesound:
    # API token via FREESOUND_API_KEY in .env (https://freesound.org/apiv2/apply/)
    default_query: "ambient drone calm"
    page_size: 15
    min_duration: 20        # seconds; shorter sounds loop too obviously as a bed
